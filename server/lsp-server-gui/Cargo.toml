[package]
name = "lsp-server-gui"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = ["dioxus/desktop", "tokio", "rfd", "arboard", "dirs", "tracing-subscriber", "rustls"]
web = ["dioxus/web", "dioxus/logger", "wasm-bindgen", "wasm-bindgen-futures", "web-sys", "js-sys"]

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "document", "mounted"] }
sc-rest-client = { path = "../sc-rest-client", default-features = false }
sc-protos = { path = "../sc-protos" }
futures-util = "0.3"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
hex = { package = "hex-conservative", version = "0.2", default-features = false, features = ["std"] }
bytes = "1.4.0"

# Native-only dependencies
tokio = { version = "1.38.0", features = ["rt-multi-thread", "sync", "time"], optional = true }
# xdg-portal instead of gtk3: wry already drives GTK on the main thread.
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }
arboard = { version = "3", optional = true, default-features = false }
dirs = { version = "5", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

# Web-only dependencies
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Response", "Storage", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "console"], optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm32-unknown-unknown has no default entropy source; route through the browser.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
