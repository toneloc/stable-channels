<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark light">
	<title>LSP Server GUI</title>
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Crect width='1024' height='1024' rx='224' fill='%231c1c1e'/%3E%3Cg fill='none' stroke='%23f7931a' stroke-linecap='round' stroke-linejoin='round'%3E%3Cg stroke-width='44'%3E%3Ccircle cx='512' cy='283' r='40' fill='%23f7931a' stroke='none'/%3E%3Cpath d='M512 300V770M330 770H694M268 360H636M268 360L185 520M268 360L353 520M185 520H355M185 520A85 64 0 0 0 355 520'/%3E%3Ccircle cx='748' cy='362' r='113'/%3E%3C/g%3E%3Cpath stroke-width='24' d='M716 314H758A23 23 0 0 1 758 360H730M730 360H763A29 29 0 0 1 763 418H716M730 314V418M740 294V314M758 294V314M740 418V438M758 418V438'/%3E%3C/g%3E%3C/svg%3E">
	<style>
		html, body { margin: 0; padding: 0; height: 100%; background: #0b0b0c; }
		@media (prefers-color-scheme: light) { html, body { background: #f2f2f7; } }
		#loading_text {
			position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; color: #8e8e93; text-align: center;
		}
		#loading_text .spinner {
			width: 36px; height: 36px; margin-bottom: 16px; border-radius: 50%;
			border: 3px solid rgba(142, 142, 147, 0.25); border-top-color: #8e8e93; animation: spin 0.9s linear infinite;
		}
		@keyframes spin { to { transform: rotate(360deg); } }
	</style>
</head>
<body>
	<div id="loading_text">
		<div class="spinner"></div>
		<p>Loading LSP Server GUI...</p>
	</div>
	<div id="main"></div>
	<script type="module">
		const crashed = (error) => {
			console.error(error);
			const el = document.getElementById("loading_text");
			if (el) {
				el.innerHTML = "<p>The app has crashed. See the developer console for details.</p>";
			}
		};
		import("./lsp_server_gui.js?v=__BUILD_HASH__")
			.then((module) => module.default({ module_or_path: "./lsp_server_gui_bg.wasm?v=__BUILD_HASH__" }))
			.then(() => document.getElementById("loading_text")?.remove())
			.catch(crashed);
	</script>
</body>
</html>
