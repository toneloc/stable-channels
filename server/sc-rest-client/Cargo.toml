[package]
name = "sc-rest-client"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = []
serde = ["sc-protos/serde"]

[dependencies]
sc-protos = { path = "../sc-protos" }
# Only the generated types are needed — depend on ldk-server-grpc directly so
# the wasm (lsp-server-gui web) build doesn't drag in the native hyper/tokio
# stack that ldk-server-client carries. Same rev as stable-channels-lsp, so the
# types unify.
ldk-server-grpc = { git = "https://github.com/lightningdevkit/ldk-server", rev = "aa2d60f51ebacc7edd5dbdfb90b53a9c73ee0bd3", features = ["serde"], default-features = false }
prost = { version = "0.11.6", default-features = false, features = ["std", "prost-derive"] }
getrandom = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false }
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }

[dev-dependencies]
futures-executor = "0.3"
