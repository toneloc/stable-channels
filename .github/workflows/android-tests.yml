name: "Mobile: Android Tests"

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'

permissions:
  contents: read

concurrency:
  group: test-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-android:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GRADLE_OPTS: "-Xmx3g -XX:+UseG1GC"

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # JVM unit tests (includes PriceOracleTest.kt — the cross-platform oracle parity suite).
      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
