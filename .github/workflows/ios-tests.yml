name: "Mobile: iOS Tests"

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-tests.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-tests.yml"

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS Unit Tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      # A cold simulator boot takes minutes; start it now so it overlaps package
      # resolution and the build instead of running after them.
      - name: Boot simulator
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j \
            | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"][]? | select(.name == "iPhone 17") | .udid' \
            | head -n 1)
          if [ -z "$udid" ]; then
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          # Already booted is fine; bootstatus -b below boots it if needed.
          xcrun simctl boot "$udid" || true

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/StableChannels/StableChannels.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -u

          last_status=1
          for attempt in 1 2 3 4; do
            echo "Resolving Swift packages (attempt ${attempt}/4)"

            if xcodebuild \
              -resolvePackageDependencies \
              -project ios/StableChannels/StableChannels.xcodeproj \
              -scheme StableChannels \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"; then
              exit 0
            else
              last_status=$?
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 15))
            fi
          done

          exit "$last_status"

      - name: Run iOS unit tests
        shell: bash
        run: |
          set -eo pipefail
          # Signing stays ENABLED: simulator builds get an automatic ad-hoc
          # signature that embeds the app-group/keychain entitlements. With
          # CODE_SIGNING_ALLOWED=NO the test host has no entitlements and every
          # real keychain test dies with errSecMissingEntitlement (-34018).
          xcodebuild build-for-testing \
            -project ios/StableChannels/StableChannels.xcodeproj \
            -scheme StableChannels \
            -destination "id=$SIMULATOR_UDID" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO
          # The simulator has been booting since the start of the job; wait for
          # it only now that the build is done.
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcodebuild test-without-building \
            -project ios/StableChannels/StableChannels.xcodeproj \
            -scheme StableChannels \
            -destination "id=$SIMULATOR_UDID" \
            -destination-timeout 180 \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -retry-tests-on-failure \
            -parallel-testing-enabled NO
