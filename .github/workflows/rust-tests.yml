name: "Core: Rust Tests"

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "server/**"
      - ".github/workflows/rust-tests.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "server/**"
      - ".github/workflows/rust-tests.yml"

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust Workspace Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_TEST_DEBUG: 1
      RUSTFLAGS: "-C link-arg=-Wl,--no-keep-memory"
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run affected Rust tests
        run: cargo test -p stable-channels -p stable-channels-lsp --locked

      - name: Build affected Rust packages
        run: cargo build -p stable-channels -p stable-channels-lsp --locked
