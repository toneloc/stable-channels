# Step 1 — Onboard over Lightning
# "User funds a Stable Channel with a Lightning payment from another app."
# Fresh install -> receive first payment -> JIT channel opens via LSP.
appId: com.stablechannels.app
tags: [android, ios, onboard]
env:
  HARNESS_API: "http://localhost:9737"
---
# NOTE: no clearState here — the suite runner clears app data once, restores
# test_config.json, then carries the resulting wallet state across all flows.
- launchApp:
    stopApp: false

# iOS first launch shows the notifications permission dialog; Android doesn't.
- tapOn:
    text: "Allow"
    optional: true

# Home reachable — Receive pulses when there is no channel yet
- extendedWaitUntil:
    visible: "Receive"
    timeout: 60000
- tapOn: "Receive"

# No channel yet -> JIT notice is shown (ReceiveScreen.kt:167)
# Android (post-#250) and iOS word the JIT notice differently — match either.
# The optional "Lightning" absorbs the pending dedup of the Android Receive-sheet copy.
- assertVisible: "(Receive a payment over Lightning to activate your( Lightning)? account\\.|Get your first payment over Lightning to activate your account)"

- tapOn: "0.00"       # amount placeholder (USD)
- inputText: "85"     # canonical stable target — matches prod history, under the $100 JIT cap
# Android-only: Gboard covers the button after amount entry. iOS neither needs
# nor supports hideKeyboard here (Maestro can't dismiss the decimal pad).
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Generate Invoice"

- extendedWaitUntil:
    visible: "(Copy|Your Lightning Invoice)"   # Android button / iOS label
    timeout: 20000
- assertVisible: "\\$85\\.00"
- copyTextFrom:
    text: "ln.*"      # the truncated invoice text element
- runScript:
    file: helpers/pay_invoice.js

# The receive sheet dismisses when the incoming payment event arrives.
# Onboarded: the trade buttons are durable; the payment banner is transient.
- extendedWaitUntil:
    visible: "USD → BTC"
    timeout: 60000
