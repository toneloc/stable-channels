# Step 15 — Rejection lands while the app is backgrounded
# The sheet is left open on "Order Pending", the app is backgrounded, and the signed
# TRADE_REJECTED_V1 arrives with the UI away. On return the sheet must show the
# rejection — this is the exact scenario the SQLite outcome-rehydration fix exists
# for (results committed outside the foreground handler must still reach the sheet).
# Requires the .pre.sh hook: frozen client price refresh, like flow 13.
appId: com.stablechannels.app
tags: [android, ios, trade]
env:
  HARNESS_API: "http://localhost:9737"
---
- launchApp:
    stopApp: true            # re-read test_config (frozen price refresh), fetch price once
- extendedWaitUntil:
    visible: "BTC → USD"
    timeout: 30000

# Baseline: flow 14's accepted trade left $4.95 stable — also the post-rejection value.
- assertVisible: "\\$4\\.95"

- tapOn: "BTC → USD"
- assertVisible: "How much BTC to convert to USD\\?"
- tapOn: "\\$?0\\.00"
- inputText: "5"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard

# Move the market 1% under the frozen client quote (limit is 0.5%), then give the
# LSP's ~10s feed poll time to observe it.
- runScript:
    file: helpers/set_price.js
    env:
      PRICE_USD: "99000"
- runScript:
    file: helpers/wait_secs.js
    env:
      SECS: "15"

- tapOn: "Continue"
- assertVisible: "Review BTC -> USD"
- tapOn: "Confirm Order"

# Take the app away with the sheet sitting on "Order Pending", so the rejection
# arrives while nothing is watching. Android backgrounds (Home key): since #251
# the node keeps running for a 10s quick-switch grace, so the sub-second
# rejection is delivered and committed while backgrounded-but-alive — exactly
# the outside-the-foreground-handler commit the rehydration fix covers. The 15s
# wait then outlasts the grace, so the return also crosses a node stop/restart
# with the outcome committed but unseen. iOS has no Maestro Home key, so it
# kills the app instead — a strictly harsher variant (result must land after a
# cold relaunch).
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Home
- runFlow:
    when:
      platform: iOS
    commands:
      - stopApp
- runScript:
    file: helpers/wait_secs.js
    env:
      SECS: "15"

# Return to the app. Maestro's relaunch may recreate the UI (dropping the sheet),
# so assert the guarantee, not the widget. On Android the rejection was committed
# during the grace window and the node has since stopped (15s > 10s grace); the
# return restarts the node and the committed outcome must still surface (sheet or
# status banner) — that resurfacing is the rehydration assertion. On iOS the kill
# loses the race with sub-second delivery — the rejection was applied before
# death — so the post-restart invariant is the allocation, asserted on both
# platforms below. (Stopped-node redelivery itself is flow 14's assertion.)
- launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "The market moved outside the quote range.*"
          timeout: 60000
      - runFlow:
          when:
            visible: "Done"
          commands:
            - tapOn: "Done"

# The allocation must not have moved, and must have survived the restart.
- extendedWaitUntil:
    visible: "\\$4\\.95"
    timeout: 30000
