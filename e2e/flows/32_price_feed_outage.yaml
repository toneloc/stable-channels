# Step 32 — Aux: a price-feed outage fails closed, then recovers
# With every feed down, trading is refused with the fresh-consensus copy and nothing settles; while dark the price falls 11% (past the oracles' 10% move limit); when feeds return both sides accept the new price, the LSP settles the drift, and trading works.
#
# Guards #239 (price-feed quorum / fail-closed accounting) and the oracle's
# large-move circuit breaker: both the app (PriceOracle) and the LSP
# (price_feeds.rs) reject a median more than 10% from the last trusted price,
# but only while that price is under 60s old. An outage longer than that must
# end in recovery — never a wallet that refuses every price forever.
#
# Money risks covered: trading or settling on a stale price during the
# outage; permanently disabled trading after it.
#
# Settlement after recovery at $89,000 on the flow-02 position (~75,309
# backing sats vs $75.31 — Android; iOS $74.22): LSP owes ≈ $8.28 → ~9,308
# sats (iOS ≈ 9,170). Tolerance spans both.
#
# Run RIGHT AFTER 01 + 02 at the $100k base. The post-hook brings the feeds
# back and walks the price home in steps under the 10% limit.
appId: com.stablechannels.app
tags: [android, ios, stability, trade, aux]
env:
  HARNESS_API: "http://localhost:9737"
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "USD → BTC"
    timeout: 30000
- runScript:
    file: helpers/mark_time.js

# ── Outage ─────────────────────────────────────────────────────────────────
- runScript:
    file: helpers/feeds_outage.js
    env:
      DOWN: "true"
# Both sides' last trusted price ages past the 60s trust window.
- runScript:
    file: helpers/wait_secs.js
    env:
      SECS: "75"

# Trading is refused, by name, before any money moves.
- tapOn: "USD → BTC"
- assertVisible: "How much USD to convert to BTC\\?"
- extendedWaitUntil:
    visible: "A fresh BTC/USD consensus is required before trading"
    timeout: 30000
# Continue must not advance to the order review (the button is disabled; its
# text node doesn't carry that state, so assert the behaviour instead).
- tapOn: "0.00"
- inputText: "2"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Continue"
- assertNotVisible: "Review USD -> BTC"
- assertVisible: "How much USD to convert to BTC\\?"
- tapOn: "Cancel"

# The market falls 11% while every feed is dark.
- runScript:
    file: helpers/set_price.js
    env:
      PRICE_USD: "89000"
- runScript:
    file: helpers/wait_secs.js
    env:
      SECS: "20"
# Nothing settled on a price nobody could verify.
- runScript:
    file: helpers/assert_audit_events.js
    env:
      EVENTS: "STABILITY_PAYMENT_V1_SENT,STABILITY_RECEIVED_RECONCILED"
      AFTER_ISO: ${output.markIso}
      EXPECT: "absent"

# ── Recovery ───────────────────────────────────────────────────────────────
- runScript:
    file: helpers/feeds_outage.js
    env:
      DOWN: "false"
# The LSP accepts $89,000 despite the 11% gap (its old anchor expired) and
# settles the drift to the user.
- runScript:
    file: helpers/assert_audit_events.js
    env:
      EVENTS: "STABILITY_PAYMENT_V1_SENT"
      AFTER_ISO: ${output.outageIso}
      MATCH: "direction=lsp_to_user"
      EXPECTED_AMOUNT_MSAT: "9240000"
      AMOUNT_TOLERANCE_MSAT: "200000"
      DEADLINE_SECS: "150"

# The app trusts the new price too: the gate is gone and a trade completes.
- tapOn: "USD → BTC"
- assertVisible: "How much USD to convert to BTC\\?"
- extendedWaitUntil:
    notVisible: "A fresh BTC/USD consensus is required before trading"
    timeout: 60000
- tapOn: "0.00"
- inputText: "2"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Continue"
- runFlow:
    when:
      visible: "Review USD -> BTC"
    commands:
      - tapOn: "Confirm Order"
- extendedWaitUntil:
    visible: "Order (Confirmed|Pending)"
    timeout: 120000
- tapOn: "Done"
