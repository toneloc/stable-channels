# Step 2 — BTC -> USD
# "User converts BTC into USD exposure."
# Selectors verified against HomeScreen.kt / SellScreen.kt.
appId: com.stablechannels.app
tags: [android, ios, trade]
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "BTC → USD"      # disabled until channel ready
    timeout: 30000

# Exercise the allocation slider itself. The first slow, outward gesture stays
# clamped at the left edge so the demo visibly holds on "0% USD  100% BTC"
# without opening a trade. The second gesture sells $75 of the $85 balance:
# target = barStart + (75 / 85) * barWidth.
- runFlow:
    when:
      platform: Android
    file: helpers/drag_btc_to_usd_android.yaml
- runFlow:
    when:
      platform: iOS
    file: helpers/hold_btc_slider_ios.yaml
- runFlow:
    when:
      platform: iOS
    file: helpers/drag_btc_to_usd_ios.yaml

# The drags aim at layout-dependent coordinates; since #256 removed the home
# header the bar sits higher and the gesture can miss entirely. The gestures
# stay (demo value), but the sheet is opened via the button when they miss,
# and BOTH platforms type their canonical amount below — downstream flows
# (03/16/25) depend on these exact numbers.
- runFlow:
    when:
      notVisible: "How much BTC to convert to USD\\?"
    commands:
      - tapOn: "BTC → USD"
- assertVisible: "How much BTC to convert to USD\\?"

# The drag's landing pixel prefills a layout-dependent amount (observed $73.34
# after the price chart shifted the bar; historically $76.07). Editing it in
# place fights Compose cursor placement (a mid-string tap + eraseText left
# "$76.07.21"), so discard the prefill and reopen the sheet empty via the
# button — flow 08's proven pattern — then type the canonical amount that
# flow 03's stability math ($75.31 net target) depends on.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Cancel"
      - tapOn: "BTC → USD"
      - assertVisible: "How much BTC to convert to USD\\?"
      - tapOn: "\\$?0\\.00"
      - inputText: "76.07"
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Cancel"
      - tapOn: "BTC → USD"
      - assertVisible: "How much BTC to convert to USD\\?"
      - tapOn: "\\$?0\\.00"
      - inputText: "74.97"

- tapOn: "Continue"

- assertVisible: "Review BTC -> USD"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "\\$76\\.07"
      - assertVisible: "\\$0\\.76"
      - assertVisible: "\\$75\\.31( USD)?"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "\\$74\\.97"
      - assertVisible: "\\$0\\.75"
      - assertVisible: "\\$74\\.22( USD)?"
# Confirm button is now "Confirm Order" on both platforms (iOS button was
# relabeled from "BTC → USD" in the copy-changes PR).
- tapOn: "Confirm Order"

# SellScreen success step (SellScreen.kt:~255)
- extendedWaitUntil:
    visible: "Order (Confirmed|Pending)"
    timeout: 30000
- tapOn: "Done"

# Back on Home
- assertVisible: "USD → BTC"
