# Step 20 — Aux: restore guard interposes over a live channel
# Restoring from seed while the wallet still has an open channel is the proven mainnet force-close class; the app must check /api/channel-exists and warn before replacing the wallet.
#
# Guards PR #174 (restore guard + channel-exists check; both platforms share
# the copy). OPT-IN like flow 11: run while the channel from 01 is OPEN and
# pass the ACTIVE wallet's own seed (reveal it via 10_backup_keys first):
#   maestro test -e RESTORE_SEED="word1 ... word12" flows/20_restore_guard.yaml
# The flow CANCELS at the guard — the wallet is never replaced.
appId: com.stablechannels.app
tags: [android, ios, keys, aux]
env:
  RESTORE_SEED: ""
---
- launchApp:
    stopApp: false
# Seed must be the ACTIVE wallet's (reveal via 10_backup_keys).
- runScript:
    file: helpers/require_restore_seed.js

- tapOn: "Settings"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Backup"
- extendedWaitUntil:
    visible: "Restore from Seed"
    timeout: 60000
- tapOn: "Restore from Seed"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "word1 word2 word3 ..."
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Paste your seed phrase here"
- inputText: ${RESTORE_SEED}
- tapOn: "Restore"

# The guard MUST interpose — this alert is what the flow exists to assert.
# (Flow 11 treats it as optional because it runs post-close; here it is the point.)
- extendedWaitUntil:
    visible: "Open Channel Detected"
    timeout: 30000
- assertVisible: ".*force-closed on-chain.*"
- tapOn: "Cancel"

# The active wallet must be untouched and the channel still working.
- tapOn:
    text: "(Home|Back)"
    optional: true
- extendedWaitUntil:
    visible: "(BTC → USD|USD → BTC)"
    timeout: 30000
