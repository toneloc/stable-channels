# Step 14 — Trade result survives an app kill
# Confirm a trade, kill the app before/while the signed result arrives, relaunch,
# and the acceptance still lands: the LSP's durable retry worker (5s/10s/20s backoff)
# redelivers the SYNC_V1 keysend and the allocation shows on home. Whichever side of
# the race the kill lands on (result applied pre-kill, or delivered post-restart via
# retry), the end state must be identical — that indifference is the assertion.
appId: com.stablechannels.app
tags: [android, ios, trade]
env:
  HARNESS_API: "http://localhost:9737"
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "BTC → USD"
    timeout: 30000

# Baseline: USD side is zero (runs after 13, whose rejection left it unchanged).
- assertVisible: "\\$0\\.00"

- tapOn: "BTC → USD"
- assertVisible: "How much BTC to convert to USD\\?"
- tapOn: "\\$?0\\.00"
- inputText: "5"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard

# Client and LSP both sit at the canonical $100,000 (13's post-hook restored it),
# so this trade will be ACCEPTED — the result just may not find the app alive.
- tapOn: "Continue"
- assertVisible: "Review BTC -> USD"
- tapOn: "Confirm Order"

# Kill the app immediately. The fee keysend already left on Confirm; the signed
# acceptance is now racing this kill.
- stopApp

# Give the LSP's retry worker time to fail a delivery attempt and reschedule.
- runScript:
    file: helpers/wait_secs.js
    env:
      SECS: "20"

- launchApp
- extendedWaitUntil:
    visible: "BTC → USD"
    timeout: 60000

# Node restart + reconnect + retried delivery + apply: $5.00 gross − 1% fee = $4.95.
- extendedWaitUntil:
    visible: "\\$4\\.95"
    timeout: 90000
