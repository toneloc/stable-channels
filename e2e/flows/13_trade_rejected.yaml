# Step 13 — Trade rejected on quote deviation
# The LSP rejects a trade whose signed quote moved >0.5% from its own price; the wallet shows the reason and the allocation stays unchanged.
# Requires the .pre.sh hook: it re-pushes test_config with price_refresh_secs so the
# client's quote is frozen at launch while set_price moves the LSP's view. The whole
# trade must complete within ~60s of launch (trusted-price age) — keep this flow lean.
appId: com.stablechannels.app
tags: [android, trade]
env:
  HARNESS_API: "http://localhost:9737"
---
- launchApp:
    stopApp: true            # re-read test_config (frozen price refresh), fetch price once
- extendedWaitUntil:
    visible: "BTC → USD"
    timeout: 30000

# USD side must start at zero (flow runs right after 01) — this is also the
# post-rejection assertion baseline.
- assertVisible: "\\$0\\.00"

- tapOn: "BTC → USD"
- assertVisible: "How much BTC to convert to USD\\?"
- tapOn: "\\$?0\\.00"
- inputText: "5"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard

# Move the market 1% under the frozen client quote (limit is 0.5%), then give the
# LSP's ~10s feed poll time to observe it. The client cannot follow: its refresh
# loop is frozen by the pre-hook config.
- runScript:
    file: helpers/set_price.js
    env:
      PRICE_USD: "99000"
- runScript:
    file: helpers/wait_secs.js
    env:
      SECS: "15"

- tapOn: "Continue"
- assertVisible: "Review BTC -> USD"
- tapOn: "Confirm Order"

# The rejection arrives as a signed 1-msat TRADE_REJECTED_V1 keysend within seconds.
- extendedWaitUntil:
    visible: "The market moved outside the quote range.*"
    timeout: 30000

# Allocation must not have moved: dismiss the sheet and confirm USD is still zero.
- tapOn: "(Cancel|Back|Done)"
- extendedWaitUntil:
    visible: "\\$0\\.00"
    timeout: 10000
