# Step 4 — Lightning Receive
# "User receives a Lightning payment from another app and BTC balance increases."
# Selectors verified against ReceiveScreen.kt.
appId: com.stablechannels.app
tags: [android, ios, receive]
env:
  HARNESS_API: "http://localhost:9737"
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Receive"
    timeout: 30000
- tapOn: "Receive"

- tapOn: "0.00"
- inputText: "10"
- tapOn: "Generate Invoice"

- extendedWaitUntil:
    visible: "(Copy|Your Lightning Invoice)"   # Android button / iOS label
    timeout: 20000
- assertVisible: "\\$10\\.00"
- copyTextFrom:
    text: "ln.*"
- runScript:
    file: helpers/pay_invoice.js

# The receive sheet dismisses when the incoming payment event arrives.
- extendedWaitUntil:
    visible: "Receive"
    timeout: 30000

# Exercise the Home payment-alert shortcut into Payment Detail.
- tapOn: "Payment received.*"
- extendedWaitUntil:
    visible: "Payment Details?"
    timeout: 30000
- assertVisible: "Received"
- assertVisible: "Lightning"
- assertVisible: "\\$10\\.00"
- tapOn: "Done"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "History"
      - tapOn: "Home"
- assertVisible: "Receive"
