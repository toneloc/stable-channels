# Step 4 — Lightning Receive
# "User receives a Lightning payment from another app, increasing their BTC balance."
# Selectors verified against ReceiveScreen.kt.
appId: com.stablechannels.app
tags: [android, ios, receive]
env:
  HARNESS_API: "http://localhost:9737"
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Receive"
    timeout: 30000
- tapOn: "Receive"

- tapOn: "0.00"
- inputText: "10"
# Android-only: Gboard covers the button after amount entry. iOS neither needs
# nor supports hideKeyboard here (Maestro can't dismiss the decimal pad).
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Generate Invoice"

- extendedWaitUntil:
    visible: "(Copy|Your Lightning Invoice)"   # Android button / iOS label
    timeout: 20000
- assertVisible: "\\$10\\.00"
- copyTextFrom:
    text: "ln.*"
- runScript:
    file: helpers/pay_invoice.js

# The receive sheet dismisses when the incoming payment event arrives.
- extendedWaitUntil:
    visible: "Receive"
    timeout: 30000

# The redesigned home (post-#256/#257) has no payment-alert capsule; verify the
# recorded payment through History -> Payment Detail instead.
- tapOn: "History"
- tapOn: "Payments"
- extendedWaitUntil:
    visible: "(\\+)?\\$10\\.00"
    timeout: 30000
- tapOn: "(\\+)?\\$10\\.00"
- extendedWaitUntil:
    visible: "Payment Details?"
    timeout: 30000
- assertVisible: "Received"
- assertVisible: "Lightning"
- assertVisible: "\\$10\\.00"
- tapOn: "Done"
- tapOn: "Home"
- assertVisible: "Receive"
