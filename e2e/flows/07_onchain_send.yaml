# Step 7 — Onchain Send
# "User sends an onchain payment to another app." With a ready channel this
# routes via splice-out (SendScreen.kt: result = "Splice-out initiated").
appId: com.stablechannels.app
tags: [android, ios, send, onchain]
env:
  HARNESS_API: "http://localhost:9737"
  MINE_BLOCKS: "6"
---
- launchApp:
    stopApp: false

- runScript:
    file: helpers/create_address.js

- tapOn: "Send"
# Focus the send field. Platform-split: on Android the unfocused
# OutlinedTextField renders its LABEL ("To"); on iOS "To" is a Section header
# ABOVE the field — tapping it focuses nothing (regression seen as an empty
# form: input lands nowhere, no Send button appears). Tap the placeholder,
# which is the TextField itself, on iOS.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "To"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Invoice or onchain address"
- setClipboard: ${output.address}
- pasteText

# Onchain input needs an amount. Android exposes the field label; iOS exposes
# the enclosing detected-type section as "Onchain Address".
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Amount \\(USD\\)"
          timeout: 20000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Onchain Address"
          timeout: 20000
- tapOn: "0.00"
- inputText: "5"
# Both platforms label the button "Send", colliding with the sheet title
# -> index 1. hideKeyboard is unreliable on iOS sims (Android-only).
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    text: "Send"
    index: 1

# Assert the platform's actual post-send success UI. On iOS, "Splice-out
# initiated" is also the pre-send route hint, so it cannot prove the send.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Splice-out initiated"
          timeout: 60000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Payment sent.*"
          timeout: 60000
# Both platforms expose Done after the send starts.
- tapOn:
    text: "Done"
    optional: true

# Do not mine until the splice transaction exists. Both platforms expose
# "Move pending..." once the splice transaction has been broadcast.
- extendedWaitUntil:
    visible: "Move pending.*"
    timeout: 60000
- runScript:
    file: helpers/mine_blocks.js
# Use the positive completion signal instead of checking that pending is absent:
# absence can pass before the UI has observed the pending splice.
- extendedWaitUntil:
    visible: "Move confirmed"
    timeout: 180000
