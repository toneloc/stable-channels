name: StableChannels
options:
  bundleIdPrefix: com.stablechannels
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

# STABILITY is set in Debug and Release and left out of AppStore (the App Store build has no stability).
configs:
  Debug: debug
  Release: release
  AppStore: release

packages:
  ldk-node:
    url: https://github.com/toneloc/ldk-node.git
    exactVersion: "0.7.5"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: "4.2.2"
  CodeScanner:
    url: https://github.com/twostraws/CodeScanner.git
    from: "2.5.0"
  QRCode:
    url: https://github.com/dagronf/QRCode.git
    from: "28.0.2"
  SCForceClose:
    path: ../../mobile/force-close/swift

targets:
  StableChannels:
    type: application
    platform: iOS
    sources:
      - path: StableChannels
      - path: NotificationService/Services/TradeProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stablechannels.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: StableChannels/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Automatic signing picks the distribution certificate when archiving.
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: VJF3VBKXV9
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: StableChannels/StableChannels.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG STABILITY"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STABILITY
    dependencies:
      - package: ldk-node
        product: LDKNode
      - package: KeychainAccess
      - package: CodeScanner
      - package: QRCode
      - package: SCForceClose
      - target: NotificationService
    info:
      path: StableChannels/Info.plist
      properties:
        CFBundleDisplayName: Stable Channels
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        NSCameraUsageDescription: "Camera is used to scan QR codes for Lightning invoices and Bitcoin addresses."

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: StableChannels/Services/Price/PriceOracle.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stablechannels.app.NotificationService
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Automatic signing picks the distribution certificate when archiving.
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: VJF3VBKXV9
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG STABILITY"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STABILITY
    dependencies:
      - package: ldk-node
        product: LDKNode

  StableChannelsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StableChannelsTests
    dependencies:
      - target: StableChannels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stablechannels.app.tests
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG STABILITY"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STABILITY

schemes:
  StableChannels AppStore:
    build:
      targets:
        StableChannels: all
    test:
      config: Debug
      targets:
        - StableChannelsTests
    run:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: Debug
    archive:
      config: AppStore
